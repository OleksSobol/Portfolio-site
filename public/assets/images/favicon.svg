<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2332"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0bcff"/>
      <stop offset="100%" stop-color="#70efde"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)" stroke="#2a3245" stroke-width="12" />

  <!-- Inner Accent Ring -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.8" />

  <!-- Monogram OS -->
  <text x="256" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="230" fill="url(#accent)" text-anchor="middle" letter-spacing="-12" filter="url(#glow)">OS</text>
</svg>
